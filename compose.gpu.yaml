# Optional NVIDIA worker. Default compose.yaml never needs NVML or CUDA.
services:
  worker:
    image: taskd-pipeline-gpu:0.3
    build:
      context: .
      dockerfile: Dockerfile.gpu
    environment:
      GPU_MODE: nvidia
      GPU_UUIDS: ${GPU_UUIDS:-}
      ALLOW_CUDA_OOM_TEST: ${ALLOW_CUDA_OOM_TEST:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
