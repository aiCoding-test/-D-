{% extends "base.html" %}{% block content %}
<section class="heading"><div><p class="eyebrow">OBSERVABLE EXECUTION</p><h1>任务总览</h1><p>从提交到产物，让每一步执行都有迹可循。</p></div><a class="button secondary" href="/docs" target="_blank">API 文档 ↗</a></section>
<div class="stats" id="stats"><div class="stat">正在加载…</div></div>
<section class="panel"><div class="panel-title"><h2>创建处理任务</h2><span class="muted">预置动画 → 7 步管线 → 模拟产物</span></div><form id="create-form"><div class="form-grid"><label>任务名称<input name="name" value="动画素材处理" maxlength="80" required></label><label>预置素材<select name="asset_id"><option value="orbit">Orbit · 轨道动画</option><option value="bounce">Bounce · 弹跳动画</option></select></label><label>演示场景<select name="scenario"><option value="normal">正常完成</option><option value="transient_once">抠图首次失败后重试</option><option value="resume_preview">预览失败，人工恢复</option><option value="slow_step">长步骤 / 中断演示</option><option value="gpu_oom">GPU OOM（模拟）</option><option value="always_fail">持续失败 / 重试耗尽</option><option value="hang_step">步骤挂起 / 超时</option></select></label><label>预览参数<select name="preview_format"><option value="svg">SVG 预览</option><option value="json">JSON 预览说明</option></select></label><label>执行配置<select name="execution_profile"><option value="demo">快速演示</option><option value="hourly">实际长跑 · 约1小时</option></select></label><label>随机种子<input name="seed" type="number" value="42" min="0" max="2147483647" required></label></div><div class="form-bottom"><label class="check"><input name="cache_read" type="checkbox" checked> 复用有效的已有结果</label><span class="muted">故障场景自动关闭缓存读取，确保可复现</span><button type="submit">＋ 创建任务</button></div></form></section>
<section class="panel"><div class="panel-title"><h2>执行任务 <span id="task-count"></span></h2><div class="filters"><select id="status-filter" aria-label="任务状态筛选"><option value="">全部状态</option><option>RUNNING</option><option>SUCCEEDED</option><option>FAILED</option><option>CANCELLED</option><option>QUEUED</option></select><span id="updated" class="muted"></span></div></div><div class="table-scroll"><table><thead><tr><th>任务</th><th>状态</th><th>执行代次</th><th>创建时间</th><th>原因 / 操作</th></tr></thead><tbody id="task-list"><tr><td colspan="5">正在加载任务…</td></tr></tbody></table></div><button id="more-tasks" class="secondary" hidden>加载更多</button></section>
<section id="resources" class="panel"><div class="panel-title"><h2>计算资源</h2><span class="pill">MOCK TELEMETRY</span></div><div id="resource-list" class="resource-grid"></div><p class="muted" id="workers"></p></section>
{% endblock %}
